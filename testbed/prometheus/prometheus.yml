global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The CORE Lab NCSRD toolkit. (A /metrics endpoint is a near-term TODO — until then this target is
  # expected to be DOWN; it is wired so the dashboard works the moment instrumentation lands.)
  - job_name: corelab
    static_configs:
      - targets: ["corelab:5000"]

  # Open5GS NFs expose Prometheus metrics (default :9091) when the metrics module is enabled in
  # amf.yaml / smf.yaml / upf.yaml. Adjust the host if Open5GS runs in a different compose/host.
  - job_name: open5gs
    static_configs:
      - targets:
          - "host.docker.internal:9091"
        labels:
          stack: open5gs
