name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          rm -rf chroma_db
          pytest testing_netapp -q

  toolkit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolkit dependencies (light set)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-toolkit.txt

      - name: Run toolkit test suite
        run: pytest tests -q

      - name: Validate testbed compose
        run: docker compose -f testbed/docker-compose.yml config --quiet

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/corelab

      - name: Template-render chart (with persistence variant)
        run: |
          helm template ci helm/corelab > /dev/null
          helm template ci helm/corelab --set ollama.persistence.enabled=true > /dev/null

