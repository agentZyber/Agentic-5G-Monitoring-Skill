apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zortenet.fullname" . }}-config
  labels:
    {{- include "zortenet.labels" . | nindent 4 }}
data:
  ZORTENET_PACKS: {{ .Values.config.packs | quote }}
  ZORTENET_LLM: {{ .Values.config.llmProvider | quote }}
  OLLAMA_MODEL: {{ .Values.config.ollamaModel | quote }}
  {{- if .Values.ollama.enabled }}
  OLLAMA_HOST: {{ include "zortenet.ollamaHost" . | quote }}
  {{- end }}
  ZORTENET_EXECUTOR: {{ .Values.config.executor | quote }}
  ZORTENET_TRAJECTORIES: {{ .Values.config.trajectories | quote }}
  {{- if .Values.config.publicUrl }}
  ZORTENET_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
