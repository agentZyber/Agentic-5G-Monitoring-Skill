{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "corelab.fullname" . }}-ollama
  labels:
    {{- include "corelab.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "corelab.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "corelab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - name: ollama
              containerPort: {{ .Values.ollama.port }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- if .Values.ollama.persistence.enabled }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          {{- end }}
      {{- if .Values.ollama.persistence.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "corelab.fullname" . }}-ollama-models
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "corelab.fullname" . }}-ollama
  labels:
    {{- include "corelab.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    {{- include "corelab.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - name: ollama
      port: {{ .Values.ollama.port }}
      targetPort: ollama
{{- if .Values.ollama.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "corelab.fullname" . }}-ollama-models
  labels:
    {{- include "corelab.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
  {{- if .Values.ollama.persistence.storageClassName }}
  storageClassName: {{ .Values.ollama.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- end }}
